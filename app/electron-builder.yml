appId: app.noctune.player
electronVersion: 33.2.1
# Renderer and main are fully bundled, so no node_modules ship in the app.
npmRebuild: false
productName: Noctune
copyright: Copyright © 2026 Noctune
directories:
  output: release
  buildResources: build
files:
  - dist/**
  - dist-electron/**
  - package.json
asarUnpack:
  - dist/demo/**
mac:
  category: public.app-category.music
  target:
    - target: dmg
      arch: [x64, arm64]
    - target: zip
      arch: [x64, arm64]
  icon: build/icon.png
  # Fixed names (no version), so the website can link to releases/latest/download/<name>.
  artifactName: Noctune-mac-${arch}.${ext}
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # Notarization runs when APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID are set in CI.
  notarize: false
win:
  target: [nsis, portable]
  icon: build/icon.png
nsis:
  artifactName: Noctune-Setup.${ext}
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
portable:
  artifactName: Noctune-Portable.${ext}
linux:
  target: [AppImage, deb, tar.gz]
  category: AudioVideo;Audio;Player
  icon: build/icon.png
  maintainer: Noctune
  synopsis: Retro console music player
  # x64 only, so no arch in the name: Noctune-linux.AppImage / .deb / .tar.gz
  artifactName: Noctune-linux.${ext}
appImage:
  artifactName: Noctune-linux.${ext}
deb:
  artifactName: Noctune-linux.${ext}
dmg:
  artifactName: Noctune-mac-${arch}.${ext}
publish:
  provider: github
  owner: kerioxsx
  repo: noctune
  releaseType: release
