name: Build desktop apps

# Builds Noctune for macOS, Windows and Linux on every push to main and on pull requests.
# Pushing a tag like v0.1.0 also attaches the installers to a draft GitHub release.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# Least privilege: read-only by default; each job that writes asks for exactly that.
permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: --mac
          - os: windows-latest
            target: --win
          - os: ubuntu-latest
            target: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck and bundle
        run: npm run build -w app
      - name: Package
        working-directory: app
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS signing/notarization runs only when these secrets are configured.
          CSC_LINK: ${{ secrets.MAC_CERT_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.MAC_CERT_P12_BASE64 != '' }}
        run: |
          # An empty CSC_LINK is read as a path to the working folder, so drop unset signing secrets.
          for v in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!v}" ]; then unset "$v"; fi
          done
          npx electron-builder ${{ matrix.target }} --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: noctune-${{ runner.os }}
          path: |
            app/release/Noctune-*.dmg
            app/release/Noctune-*.zip
            app/release/Noctune-*.exe
            app/release/Noctune-*.AppImage
            app/release/Noctune-*.deb
            app/release/Noctune-*.tar.gz
            app/release/*.blockmap
            app/release/latest*.yml
          if-no-files-found: error

  # Publishes the installers as the latest GitHub Release, so the website's download
  # buttons (releases/latest/download/<name>) always fetch the newest build.
  release:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: noctune-*
          path: installers
          merge-multiple: true
      - id: version
        run: echo "v=$(node -p "require('./app/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Version file for in-app update checks
        run: echo "{\"tag\":\"v${{ steps.version.outputs.v }}\",\"version\":\"${{ steps.version.outputs.v }}\"}" > installers/version.json
      - run: ls -la installers
      # third-party action pinned to an exact commit (v2)
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          tag_name: v${{ steps.version.outputs.v }}
          name: Noctune ${{ steps.version.outputs.v }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          fail_on_unmatched_files: true
          files: |
            installers/Noctune-*.dmg
            installers/Noctune-*.zip
            installers/Noctune-*.exe
            installers/Noctune-*.AppImage
            installers/Noctune-*.deb
            installers/Noctune-*.tar.gz
            installers/*.blockmap
            installers/latest*.yml
            installers/version.json
          body: |
            Download the installer for your system:

            - macOS (Apple silicon): Noctune-mac-arm64.dmg
            - macOS (Intel): Noctune-mac-x64.dmg
            - Windows: Noctune-Setup.exe, or Noctune-Portable.exe with no install
            - Linux: Noctune-linux.AppImage, Noctune-linux.deb or Noctune-linux.tar.gz

            macOS builds are not signed yet: the first time, right-click Noctune and choose Open.

  website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build -w website
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/dist

  # Publishes the site to GitHub Pages on pushes to main.
  # One-time setup: repository Settings -> Pages -> Source: GitHub Actions.
  deploy-website:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: website
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
